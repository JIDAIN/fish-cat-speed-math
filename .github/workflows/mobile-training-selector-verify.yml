name: Mobile Training Selector Verify

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/mobile-training-selector-verify.yml"
      - ".github/scripts/mobile_training_selector_patch.py"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply mobile selector patch
        run: python .github/scripts/mobile_training_selector_patch.py

      - name: Install
        run: npm ci

      - name: Production audit
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Commit verified mobile selector
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/TrainingTypeSelector.tsx \
                  src/components/SkillDrillSelector.tsx \
                  src/components/TrainingTypeSelector.test.tsx \
                  src/app/page.test.tsx \
                  src/app/globals.css
          git diff --cached --stat
          git commit -m "Simplify mobile training selection hierarchy"
          git push origin master
