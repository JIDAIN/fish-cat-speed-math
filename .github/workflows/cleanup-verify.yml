name: Cleanup Verify

on:
  push:
    branches: [cleanup/remove-160-leaf]

permissions:
  contents: write

concurrency:
  group: cleanup-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-160-leaf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove final retired leaf field
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/canonical-a-generate.ts')
          text = path.read_text()
          text = text.replace('    secondarySkillIds: [],\n', '')
          path.write_text(text)
          PY
          if ! git diff --quiet -- src/lib/canonical-a-generate.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/canonical-a-generate.ts
            git commit -m "refactor: remove final retired leaf field"
            git push origin HEAD:cleanup/remove-160-leaf
          fi
      - name: Audit runtime leaf remnants
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const allowed = new Set([
            'A-ADD-01', 'A-SUB-01', 'A-COM-01', 'A-MUL-01',
            'A-MUL-02', 'A-MUL-03', 'A-FRA-01', 'A-PCT-01'
          ]);
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (/\.(ts|tsx)$/.test(entry.name) && !/\.test\.(ts|tsx)$/.test(entry.name)) files.push(full);
            }
          }
          walk('src');
          const problems = [];
          for (const file of files) {
            const text = fs.readFileSync(file, 'utf8');
            for (const forbidden of ['stepSkillId', 'secondarySkillIds', 'C-DIVSCALE', 'C-DIVSPLIT']) {
              if (text.includes(forbidden)) problems.push(`${file}: retired field/id ${forbidden}`);
            }
            const ids = text.match(/A-[A-Z]+-\d{2}/g) || [];
            for (const id of ids) if (!allowed.has(id)) problems.push(`${file}: retired A id ${id}`);
            const bIds = text.match(/B-[A-Z][A-Z0-9-]*/g) || [];
            for (const id of bIds) problems.push(`${file}: retired B ability id ${id}`);
          }
          if (problems.length) {
            console.error(problems.join('\n'));
            process.exit(1);
          }
          console.log(`runtime leaf audit passed across ${files.length} source files`);
          NODE
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
