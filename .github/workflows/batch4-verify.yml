name: Batch 4 Verify

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/batch4-verify.yml"
      - "src/lib/batch4-skill-generate.ts"
      - "src/lib/batch4-skill-generate.test.ts"
      - "src/lib/implemented-skill-drills.ts"
      - "src/lib/session.ts"
      - "src/lib/training.ts"
      - "src/components/SkillDrillSelector.tsx"
      - "src/components/TrainingTypeSelector.tsx"

permissions:
  contents: write

concurrency:
  group: batch4-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Fix L3 percent-split edge template if needed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/batch4-skill-generate.ts')
          text = path.read_text(encoding='utf-8')
          old = '{ target: 30.5, allowed: ["20,7.5,3"] },'
          new = '{ target: 30.5, allowed: ["25,3,2.5"] },'
          if old in text:
              text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit edge-template fix when present
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source patch needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/batch4-skill-generate.ts
            git commit -m "Fix batch 4 L3 percent split template"
            git push origin HEAD:master
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build
