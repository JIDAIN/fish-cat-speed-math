name: Stage 4 Acceptance

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/stage4-acceptance.yml"

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Full test suite
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Production server smoke test
        run: |
          npm start -- -H 127.0.0.1 -p 3000 >/tmp/speed-math-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ -o /tmp/home.html; then
              break
            fi
            sleep 1
          done
          test -s /tmp/home.html
          grep -q '<html' /tmp/home.html
          curl -fsSI http://127.0.0.1:3000/ | grep -q '200 OK'

      - name: Production dependency audit snapshot
        run: |
          npm audit --omit=dev --json >/tmp/audit.json || true
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/audit.json').read_text())
          meta = data.get('metadata', {})
          vulns = meta.get('vulnerabilities', {})
          print('production dependency audit:', vulns)
          details = data.get('vulnerabilities', {})
          for name, item in sorted(details.items()):
              print(f"- {name}: severity={item.get('severity')} direct={item.get('isDirect')} range={item.get('range')}")
          PY
