name: V2 Verify

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format touched V2 files in the ephemeral runner
        run: >-
          npx prettier --write
          src/lib/legacy-skill-migration.ts
          src/lib/legacy-skill-migration.test.ts
          src/lib/session.ts
          src/lib/session.test.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
