name: Batch 7 Verify

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/batch7-verify.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Apply batch 7 source fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/lib/batch7-skill-generate.ts")
          text = path.read_text()

          old = "const factor = changes.reduce((value, percent) => value * (1 + percent / 100), 1);"
          assert old in text
          text = text.replace(
              old,
              "const factor = changes.reduce<number>((value, percent) => value * (1 + percent / 100), 1);",
          )

          pattern = re.compile(
              r"if \(result <= 0\) \{\n\s+result \+= Math\.abs\(result\) \+ 1000;\n\s+terms\[0\] \+= Math\.abs\(result\) \+ 1000;\n\s+\}"
          )
          replacement = """if (result <= 0) {
              const adjustment = Math.abs(result) + 1000;
              result += adjustment;
              terms[0] += adjustment;
            }"""
          text, count = pattern.subn(replacement, text, count=1)
          assert count == 1

          old = 'function compareOptions(answer: "left" | "right" | "equal") {'
          assert old in text
          text = text.replace(old, "function compareOptions() {")
          text = text.replace("compareOptions(answer)", "compareOptions()")

          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/batch7-skill-generate.ts
          git commit -m "Fix batch 7 generator type and edge cases"
          git push origin HEAD:master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build
