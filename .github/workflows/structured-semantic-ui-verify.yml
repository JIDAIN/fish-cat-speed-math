name: Structured Semantic UI Verify

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/structured-semantic-ui-verify.yml"
      - ".github/scripts/structured_semantic_ui_patch.py"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply structured semantic UI patch
        run: python .github/scripts/structured_semantic_ui_patch.py

      - name: Install
        run: npm ci

      - name: Production audit
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Full test suite
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Commit verified structured UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/StructuredAnswerInput.tsx \
                  src/components/StructuredSingleAnswerTraining.tsx \
                  src/components/StructuredAnswerInput.test.tsx \
                  src/components/StructuredSingleAnswerTraining.test.tsx \
                  src/lib/session.ts \
                  src/lib/session.test.ts \
                  src/lib/batch7-skill-generate.test.ts \
                  src/app/page.tsx \
                  src/app/page.test.tsx \
                  src/app/globals.css
          git diff --cached --stat
          git commit -m "Replace numeric semantic adapters with structured UI"
          git push origin master
