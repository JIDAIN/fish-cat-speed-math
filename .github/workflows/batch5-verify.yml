name: Batch 5 Verify

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/batch5-verify.yml"

permissions:
  contents: write

concurrency:
  group: batch5-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Wire flow persistence and training page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          storage = Path('src/lib/storage.ts')
          text = storage.read_text(encoding='utf-8')
          original = text
          text = text.replace(
              '  SkillId,\n  StepRecord,\n  StructuredInputKind,',
              '  SkillId,\n  StepRecord,\n  StepTimerSnapshot,\n  StructuredInputKind,',
              1,
          )
          marker = '\nfunction normalizeSkillId(value: unknown): SkillId | undefined {'
          helper = '''\nfunction normalizeStepChoices(value: unknown): QuestionStepSpec["choices"] {\n  if (!Array.isArray(value)) return undefined;\n  const choices = value\n    .filter(isRecord)\n    .map((item) =>\n      typeof item.value === "string" && typeof item.label === "string"\n        ? { value: item.value, label: item.label }\n        : undefined,\n    )\n    .filter((item): item is { value: string; label: string } => Boolean(item));\n  return choices.length === value.length ? choices : undefined;\n}\n\nfunction normalizeStepTimer(value: unknown): StepTimerSnapshot | undefined {\n  if (!isRecord(value)) return undefined;\n  if (\n    typeof value.accumulatedMs !== "number" ||\n    (typeof value.runningSince !== "number" && value.runningSince !== null) ||\n    typeof value.interrupted !== "boolean"\n  )\n    return undefined;\n  return {\n    accumulatedMs: Math.max(0, value.accumulatedMs),\n    runningSince: value.runningSince,\n    interrupted: value.interrupted,\n  };\n}\n'''
          if marker not in text:
              raise SystemExit('storage marker missing')
          text = text.replace(marker, helper + marker, 1)
          old = '''    allowedAnswerSet: normalizeAnswerValueArray(value.allowedAnswerSet),\n    targetPrecision,\n  };\n}\n\nfunction normalizeStepRecord'''
          new = '''    allowedAnswerSet: normalizeAnswerValueArray(value.allowedAnswerSet),\n    targetPrecision,\n    acceptedRange:\n      isRecord(value.acceptedRange) &&\n      typeof value.acceptedRange.min === "number" &&\n      typeof value.acceptedRange.max === "number"\n        ? { min: value.acceptedRange.min, max: value.acceptedRange.max }\n        : undefined,\n    choices: normalizeStepChoices(value.choices),\n  };\n}\n\nfunction normalizeStepRecord'''
          if old not in text:
              raise SystemExit('normalizeStepSpec anchor missing')
          text = text.replace(old, new, 1)
          old = '''    primarySkillId: normalizeSkillId(value.primarySkillId),\n    difficultyBand,\n  };\n}\n'''
          new = '''    primarySkillId: normalizeSkillId(value.primarySkillId),\n    difficultyBand,\n    currentStepIndex:\n      typeof value.currentStepIndex === "number" && value.currentStepIndex >= 0\n        ? Math.floor(value.currentStepIndex)\n        : undefined,\n    currentStepAnswer:\n      typeof value.currentStepAnswer === "string"\n        ? value.currentStepAnswer\n        : undefined,\n    currentStepRecords: Array.isArray(value.currentStepRecords)\n      ? value.currentStepRecords\n          .map(normalizeStepRecord)\n          .filter((step): step is StepRecord => Boolean(step))\n      : undefined,\n    currentStepTimer: normalizeStepTimer(value.currentStepTimer),\n    currentStepEditCount:\n      typeof value.currentStepEditCount === "number"\n        ? Math.max(0, Math.floor(value.currentStepEditCount))\n        : undefined,\n  };\n}\n'''
          if old not in text:
              raise SystemExit('normalizeSession return anchor missing')
          text = text.replace(old, new, 1)
          if text == original:
              raise SystemExit('storage was not changed')
          storage.write_text(text, encoding='utf-8')

          page = Path('src/app/page.tsx')
          text = page.read_text(encoding='utf-8')
          original = text
          text = text.replace(
              'import { TrainingTypeSelector } from "@/components/TrainingTypeSelector";\n',
              'import { TrainingTypeSelector } from "@/components/TrainingTypeSelector";\nimport { StructuredStepTraining } from "@/components/StructuredStepTraining";\n',
              1,
          )
          text = text.replace(
              'import { submitCurrentAnswer } from "@/lib/training";',
              'import { submitCurrentAnswer, submitCurrentStep } from "@/lib/training";',
              1,
          )
          old = '    const next = submitCurrentAnswer(session, elapsed, scratch, Date.now());'
          new = '''    const submittedAt = Date.now();\n    const next =\n      current?.inputKind === "steps"\n        ? submitCurrentStep(session, elapsed, scratch, submittedAt)\n        : submitCurrentAnswer(session, elapsed, scratch, submittedAt);'''
          if old not in text:
              raise SystemExit('submit anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              '          {session.subtype !== "percent_to_fraction" ? (',
              '          {current.inputKind !== "steps" && session.subtype !== "percent_to_fraction" ? (',
              1,
          )
          old = '''          {session.questionType === "fraction_comparison" ? (\n            <FractionComparisonDisplay'''
          new = '''          {current.inputKind === "steps" ? (\n            <StructuredStepTraining\n              isRestarting={isRestartingTraining}\n              now={now}\n              onChange={(nextSession) => {\n                sessionRef.current = nextSession;\n                setSession(nextSession);\n              }}\n              onRestart={restartTraining}\n              onSubmit={submit}\n              session={session}\n            />\n          ) : session.questionType === "fraction_comparison" ? (\n            <FractionComparisonDisplay'''
          if old not in text:
              raise SystemExit('display anchor missing')
          text = text.replace(old, new, 1)
          old = '''          {session.questionType === "fraction_comparison" ? (\n            <div className="comparisonPad trainingKeypad">'''
          new = '''          {current.inputKind === "steps" ? null : session.questionType === "fraction_comparison" ? (\n            <div className="comparisonPad trainingKeypad">'''
          if old not in text:
              raise SystemExit('keypad anchor missing')
          text = text.replace(old, new, 1)
          if text == original:
              raise SystemExit('page was not changed')
          page.write_text(text, encoding='utf-8')
          PY

      - name: Commit integration patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No integration patch needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/storage.ts src/app/page.tsx
            git commit -m "Wire batch 5 structured split flow"
            git push origin HEAD:master
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build
